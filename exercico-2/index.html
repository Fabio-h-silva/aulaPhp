<!DOCTYPE html>
<html>
<head>
    <title>Calcula de Juros Compostos</title>
</head>

<body>
    <h1>Simulador de Investimento</h1>

<!-- //Criação de foemulario para conecta o HTML ao PHP -->
    <form action="./calculo-de-juros.php" method="post"> 
    
    <!-- Linha do formulario para usuário difgitar o valor que irá ser capiturado para PHP  -->
    <label for="lcapital">Capital inicial (R$):</label>
    <input type="number" id="lcapital" name="capital"><br><br>

    <label for="ltaxa">Taxa de Juros anual (%):</label>
    <input type="number" id="ltaxa" name="taxa"><br><br>
    
    <label for="lanos">Numero de anos:</label>
    <input type="number" id="lanos" name="anos"><br><br>
     
    <input type="submit" value="Calcular"> 
    <!-- //value serve para mudar o nome do botão -->
</form>
