<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de despesas e parcelamento</title>
</head>
<body>
    <h1>Simulador de parcelamento de dívida</h1>

    <form action="./programa.php" method="post">

    <!-- Linha do formulario para usuário difgitar o valor que irá ser capiturado para PHP  -->
    <label for="ldivida">Valor da dívida:</label>
    <input type="number" id="ldivida" name="divida" min="0,01" required><br><br>

    <label for="lparcela">Numero de parcelas: (2 a 12)</label>
    <input type="number" id="lparcela" name="parcela" min="2" max="12" required><br><br>
    
    

    <input type="submit" value="enviar">
</form>
    
</body>
</html>
